aid: admitkard
name: Admitkard
description: >-
  AdmitKard is a Noida, India based study-abroad EdTech company, founded in 2016 by IIT-IIM alumni Piyush Bhartiya and Rachit Agrawal, that guides Indian students through the full overseas-education journey: university and course shortlisting, profile building, test preparation, applications, SOP/LOR support, scholarships, education loans, foreign-exchange remittance, student visas and accommodation. The company is an ICEF-accredited and AIRC-certified agency and raised a Rs 50 crore (about $6M) Series A led by GSV Ventures in 2023. It sells counselling services to students and universities rather than a developer product: as of this profile it publishes no public API, developer portal, SDK or machine-readable contract, and its api.admitkard.com host answers with a Cloudflare 522 origin timeout.
